/* ==================================================
   ADD COMPLAINT TYPE
================================================== */

function addComplaintType() {

    const type = prompt("Enter new complaint type:");

    if (type && type.trim() !== "") {

        const option = document.createElement("option");

        option.textContent = type.trim();

        document.getElementById("complaintType")
            .appendChild(option);

        document.getElementById("complaintType")
            .value = type.trim();
    }
}


/* ==================================================
   REMOVE COMPLAINT TYPE
================================================== */

function removeComplaintType() {

    const select = document.getElementById("complaintType");

    if (select.options.length > 1) {
        select.remove(select.selectedIndex);
    }
}


/* ==================================================
   IMAGE PREVIEW
================================================== */

function previewImage() {

    const file = document.getElementById("image").files[0];

    const preview = document.getElementById("imagePreview");

    if (file) {

        preview.src = URL.createObjectURL(file);

        preview.style.display = "block";

    } else {

        preview.style.display = "none";
    }
}


/* ==================================================
   VOICE RECORDING
================================================== */

let mediaRecorder;
let audioChunks = [];
let voiceBlob = null;

async function startRecording() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        audioChunks = [];

        mediaRecorder =
            new MediaRecorder(stream);

        mediaRecorder.ondataavailable = function(event) {

            audioChunks.push(event.data);
        };

        mediaRecorder.onstop = function() {

            voiceBlob = new Blob(
                audioChunks,
                { type: "audio/webm" }
            );

            const audioURL =
                URL.createObjectURL(voiceBlob);

            const player =
                document.getElementById("audioPlayer");

            player.src = audioURL;
            player.style.display = "block";
        };

        mediaRecorder.start();

        document.getElementById("startBtn")
            .disabled = true;

        document.getElementById("stopBtn")
            .disabled = false;

    } catch (error) {

        alert("Microphone permission is required.");
    }
}


function stopRecording() {

    if (mediaRecorder &&
        mediaRecorder.state !== "inactive") {

        mediaRecorder.stop();

        mediaRecorder.stream
            .getTracks()
            .forEach(track => track.stop());

        document.getElementById("startBtn")
            .disabled = false;

        document.getElementById("stopBtn")
            .disabled = true;
    }
}


function deleteRecording() {

    voiceBlob = null;

    audioChunks = [];

    const player =
        document.getElementById("audioPlayer");

    player.src = "";

    player.style.display = "none";
}


/* ==================================================
   SUBMIT COMPLAINT
================================================== */

async function submitComplaint() {

    const message =
        document.getElementById("message");

    message.className = "";
    message.textContent = "";

    const formData = new FormData();

    formData.append(
        "name",
        document.getElementById("name").value
    );

    formData.append(
        "phone",
        document.getElementById("phone").value
    );

    formData.append(
        "email",
        document.getElementById("email").value
    );

    formData.append(
        "location",
        document.getElementById("location").value
    );

    formData.append(
        "complaint_type",
        document.getElementById("complaintType").value
    );

    formData.append(
        "description",
        document.getElementById("description").value
    );


    const image =
        document.getElementById("image").files[0];

    if (image) {
        formData.append("image", image);
    }


    if (voiceBlob) {

        formData.append(
            "voice",
            voiceBlob,
            "voice_note.webm"
        );
    }


    try {

        const response = await fetch(
            `${BACKEND_URL}/api/complaints`,
            {
                method: "POST",
                body: formData
            }
        );


        const result =
            await response.json();


        if (!response.ok ||
            !result.success) {

            throw new Error(
                result.error ||
                "Server error"
            );
        }


        const data = result.data;


        document.getElementById("result")
            .style.display = "block";


        document.getElementById("resultType")
            .textContent =
            data.complaint_type;


        document.getElementById("priority")
            .textContent =
            data.priority;


        document.getElementById("severity")
            .textContent =
            data.severity;


        document.getElementById("reason")
            .textContent =
            data.reason;


        document.getElementById("department")
            .textContent =
            data.department;


        document.getElementById("status")
            .textContent =
            data.status;


        const lang =
            document.getElementById(
                "languageSelect"
            ).value;


        message.className = "success";

        message.textContent =
            translations[lang].submitted;


    } catch (error) {

        message.className = "error";

        message.textContent =
            "❌ Error: " + error.message;

        console.error(error);
    }
}
